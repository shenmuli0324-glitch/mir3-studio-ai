[package]
name = "mir3-domain"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = [ "bundled" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
walkdir = "2"
encoding_rs = "0.8"
similar = "2"
calamine = "0.26"
easyexcel-xls = "0.1.3"
mir3-map = { path = "../mir3-map" }
getrandom = "0.3"
