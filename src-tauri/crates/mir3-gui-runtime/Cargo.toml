[package]
name = "mir3-gui-runtime"
version = "0.1.0"
edition = "2021"
description = "Sandboxed 996 GUI compatibility runtime for MIR3 Studio AI"

[dependencies]
mlua = { version = "0.12", features = ["lua51", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "mir3_gui_runtime"
path = "src/lib.rs"

[[bin]]
name = "mir3-gui-runtime"
path = "src/main.rs"
