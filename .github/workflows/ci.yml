name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  unit-test:
    uses: sxzz/workflows/.github/workflows/unit-test.yml@main
    with:
      lint: pnpm run lint # && pnpm run knip

  brand-and-types:
    name: Brand audit and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm brand:audit
      - run: pnpm typecheck
      - run: pnpm test -- --run

  rust:
    name: Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # coverage:
  #   uses: sxzz/workflows/.github/workflows/coverage.yml@main
  #   needs: unit-test
  #   permissions:
  #     id-token: write
