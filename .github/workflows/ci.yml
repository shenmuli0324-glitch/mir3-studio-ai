name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  unit-test:
    uses: sxzz/workflows/.github/workflows/unit-test.yml@main
    with:
      lint: pnpm run lint # && pnpm run knip

  brand-and-types:
    name: Brand audit and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
        env:
          MIR3_VERSION_BASE: ${{ github.event.pull_request.base.sha }}
      - run: pnpm brand:audit
      - run: pnpm plugin:audit
      - run: pnpm typecheck
      - run: pnpm exec vitest run

  rust:
    name: Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Tauri 在解析 externalBin 时要求目标平台 sidecar 已存在；干净 CI 环境
      # 不含本地 ignored 产物，先按当前 runner 构建 MIR3 MCP。
      - run: node scripts/prepare-mir3-sidecar.mjs debug
      - run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked

  # coverage:
  #   uses: sxzz/workflows/.github/workflows/coverage.yml@main
  #   needs: unit-test
  #   permissions:
  #     id-token: write
