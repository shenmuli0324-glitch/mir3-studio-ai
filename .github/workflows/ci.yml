name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-and-governance:
    name: Frontend and governance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm typecheck
      - name: Test frontend
        run: pnpm test -- --run
      - name: Lint frontend
        run: pnpm lint
      - name: Detect unused frontend code
        run: pnpm knip
      - name: Verify version, brand, plugin, domain, and release gates
        run: pnpm release:check
        env:
          # Reusable release calls retain the tag/workflow_dispatch event; only PRs have a comparison base.
          MIR3_VERSION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      - name: Check changed-range and working-tree whitespace
        env:
          MIR3_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          diff_base="$MIR3_DIFF_BASE"
          if [ -n "$diff_base" ] && [ -z "${diff_base//0/}" ]; then
            diff_base=''
          fi
          if [ -n "$diff_base" ] && ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            diff_base=''
          fi
          if [ -z "$diff_base" ]; then
            diff_base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$diff_base" ]; then
            git diff --check "${diff_base}...HEAD"
          fi
          git diff --check

  rust:
    name: Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # Tauri 在解析 externalBin 时要求目标平台 sidecar 已存在；干净 CI 环境
      # 不含本地 ignored 产物，先按当前 runner 构建 MIR3 MCP。
      - name: Prepare MIR3 MCP sidecar
        run: node scripts/prepare-mir3-sidecar.mjs debug
      - name: Check Rust workspace
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --locked
      - name: Test Rust workspace
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked -- --test-threads=1

  rust-operation-matrix:
    name: Rust operation matrix (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # 常规 workspace 测试忽略完整生命周期矩阵；这里按稳定 systemId 索引并行补齐。
      # 本 workflow 被 release.yml 复用，因此发布与 PR 都必须等待全部八片通过。
      - name: Test governed operation lifecycle shard
        env:
          MIR3_OPERATION_MATRIX_SHARD_INDEX: ${{ matrix.shard }}
          MIR3_OPERATION_MATRIX_SHARD_TOTAL: 8
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked -p mir3-mcp
          tests::every_writable_official_operation_compiles_into_a_scoped_draft --
          --ignored --exact --test-threads=1

  rust-global-workflow:
    name: Rust global workflow matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test 3, 8, and 33-system global workflows
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --locked -p mir3-mcp
          tests::global_workflow_mcp_scales_across_three_eight_and_all_domains --
          --ignored --exact --test-threads=1
